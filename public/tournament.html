<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>賽程管理 — Corner X</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="shell">
    <div class="back-row">
      <a class="back-btn" href="/tournaments.html">←</a>
      <div class="page-title" style="margin:0;" id="t-title">賽程管理</div>
    </div>

    <div id="content"><div class="loading">載入中…</div></div>
  </div>

  <div class="sticky-actions">
    <div class="inner">
      <button class="btn btn-secondary" id="btn-share">🔗 分享賽程</button>
      <button class="btn btn-danger" id="btn-delete" style="max-width:110px;">刪除</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/bracket-view.js"></script>
  <script>
    const id = CX.qs('id');
    const content = document.getElementById('content');
    let current = null;

    async function load() {
      try {
        const t = await CX.api(`/tournaments/${encodeURIComponent(id)}`);
        current = t;
        document.getElementById('t-title').textContent = t.name;
        const bracketDiv = document.createElement('div');
        content.innerHTML = '';
        content.appendChild(bracketDiv);
        CXBracket.renderBracket(bracketDiv, t.data, {
          editable: t.status !== 'done',
          onRecord: onRecordMatch,
        });
      } catch (e) {
        content.innerHTML = `<div class="error-box">${CX.esc(e.message)}</div>`;
      }
    }

    function onRecordMatch(matchId) {
      const match = current.data.matches.find((m) => m.id === matchId);
      if (!match) return;
      CXBracket.openScoreModal(match, async (a, b) => {
        const updated = await CX.api(`/tournaments/${encodeURIComponent(id)}/matches/${encodeURIComponent(matchId)}/result`, {
          method: 'POST',
          body: { scoreA: a, scoreB: b },
        });
        current = updated;
        const bracketDiv = document.createElement('div');
        content.innerHTML = '';
        content.appendChild(bracketDiv);
        CXBracket.renderBracket(bracketDiv, updated.data, {
          editable: updated.status !== 'done',
          onRecord: onRecordMatch,
        });
        CX.toast('已記錄比賽結果');
      });
    }

    document.getElementById('btn-share').addEventListener('click', async () => {
      try {
        const { url } = await CX.api(`/tournaments/${encodeURIComponent(id)}/share`, { method: 'POST' });
        const full = location.origin + url;
        const mask = document.createElement('div');
        mask.className = 'modal-mask';
        mask.innerHTML = `<div class="modal-sheet" style="position:relative;">
          <span class="modal-close">✕</span>
          <h3>分享賽程</h3>
          <div class="share-box">
            <div class="hint" style="margin-bottom:8px;">任何拿到這個連結的人都可以「觀看」賽程進度，但無法修改。</div>
            <div class="share-url" id="share-url">${CX.esc(full)}</div>
          </div>
          <button class="btn btn-primary" id="btn-copy">複製連結</button>
        </div>`;
        document.body.appendChild(mask);
        mask.addEventListener('click', (e) => { if (e.target === mask) mask.remove(); });
        mask.querySelector('.modal-close').addEventListener('click', () => mask.remove());
        mask.querySelector('#btn-copy').addEventListener('click', async () => {
          const ok = await CX.copy(full);
          CX.toast(ok ? '已複製連結' : '複製失敗，請手動選取');
        });
      } catch (e) {
        CX.toast(e.message);
      }
    });

    document.getElementById('btn-delete').addEventListener('click', async () => {
      if (!confirm('確定要刪除這個賽程嗎？此動作無法復原。')) return;
      try {
        await CX.api(`/tournaments/${encodeURIComponent(id)}`, { method: 'DELETE' });
        location.href = '/tournaments.html';
      } catch (e) {
        CX.toast(e.message);
      }
    });

    load();
  </script>
</body>
</html>
