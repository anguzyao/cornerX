<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>我的活動 — Corner X</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="shell"><div class="topbar"><a class="back-btn" href="/">←</a><div><div class="eyebrow">MY EVENTS</div><div class="page-title">我的活動</div></div></div><div id="list"><div class="loading">載入中…</div></div></div><div class="sticky-actions"><div class="inner"><a class="btn btn-secondary" href="/load-series.html">⇄ 讀取舊活動</a><a class="btn btn-primary" href="/create-series.html">＋ 建立新活動</a></div></div><script src="/js/app.js"></script><script>(async()=>{const el=document.getElementById('list');async function load(){try{const r=await CX.api('/series');if(!r.series.length){el.innerHTML='<div class="empty-state">還沒有活動<br>建立第一場吧。</div>';return}el.innerHTML=r.series.map((s,i)=>`<div class="list-item"><a class="list-open" href="#" data-i="${i}"><div class="body"><div class="name">${CX.esc(s.name)}</div><div class="meta">${CX.esc(s.event_date||'')}${s.location?' · '+CX.esc(s.location):''}</div></div><span class="badge ${s.status==='done'?'done':'ongoing'}">${s.status==='done'?'已完成':'進行中'}</span></a><button class="delete-event" data-i="${i}" title="刪除活動" aria-label="刪除活動">🗑</button></div>`).join('');el.querySelectorAll('.list-open').forEach(a=>a.onclick=(e)=>{e.preventDefault();const s=r.series[Number(a.dataset.i)];const t=localStorage.getItem('cx_control_'+s.id);if(t)location.href=`/series.html?id=${encodeURIComponent(s.id)}&token=${encodeURIComponent(t)}`;else{CX.toast('這台裝置沒有保存此活動的私人控制連結');}});el.querySelectorAll('.delete-event').forEach(btn=>btn.onclick=async()=>{const s=r.series[Number(btn.dataset.i)];if(!s)return;if(!confirm(`確定要刪除活動「${s.name}」嗎？\n\n活動的賽程、積分與歷史資料都會永久刪除，無法復原。`))return;try{await CX.api(`/series/${encodeURIComponent(s.id)}`,{method:'DELETE'});localStorage.removeItem('cx_control_'+s.id);CX.toast('活動已刪除');await load();}catch(e){CX.toast(e.message)}})}catch(e){el.innerHTML=`<div class="error-box">${CX.esc(e.message)}</div>`}}load()})()</script></body></html>
