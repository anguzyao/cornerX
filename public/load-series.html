<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>讀取舊活動 — Corner X</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="shell"><div class="topbar"><a class="back-btn" href="/">←</a><div><div class="eyebrow">CROSS-DEVICE ACCESS</div><div class="page-title">讀取舊活動</div></div></div>
<div class="panel hero-panel"><div class="eyebrow accent">CONTINUE AN EXISTING EVENT</div><h2>在這台裝置繼續你的活動</h2><p>請在建立活動的手機／裝置上取得「活動代碼」，輸入後即可讀取同一份賽程與積分資料。</p></div>
<div class="panel"><div class="section-title">活動代碼</div><div class="field"><label>8 碼代碼</label><input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" maxlength="8" placeholder="例如 ABCD2345"><div class="hint">不分大小寫；建議直接貼上代碼。</div></div><button class="btn btn-primary" id="load">讀取活動</button></div>
<div id="result"></div></div>
<script src="/js/app.js"></script><script>
const codeEl=document.getElementById('code'), result=document.getElementById('result'), btn=document.getElementById('load');
const SAVED_KEY='cx_saved_activities';
function getSaved(){try{const v=JSON.parse(localStorage.getItem(SAVED_KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function saveActivity(item){const list=getSaved().filter(x=>x.id!==item.id);list.unshift(item);localStorage.setItem(SAVED_KEY,JSON.stringify(list.slice(0,30)));}
codeEl.addEventListener('input',()=>{codeEl.value=codeEl.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);});
async function load(){
  const code=codeEl.value.trim();
  if(code.length!==8)return CX.toast('請輸入 8 碼活動代碼');
  btn.disabled=true;btn.textContent='讀取中…';
  try{
    const r=await CX.api('/series/access',{method:'POST',body:{code}});
    localStorage.setItem('cx_control_'+r.id,r.controlToken);
    let detail={};
    try{detail=await CX.api(`/series/${encodeURIComponent(r.id)}`,{controlToken:r.controlToken});}catch(e){}
    saveActivity({
      id:r.id,
      name:detail.name||r.name||'未命名活動',
      eventDate:detail.eventDate||detail.event_date||'',
      location:detail.location||'',
      status:detail.status||'ongoing',
      accessCode:code,
      controlUrl:r.controlUrl,
      lastOpened:new Date().toISOString()
    });
    result.innerHTML=`<div class="panel"><div class="eyebrow accent">FOUND</div><h3 style="margin:5px 0 8px">${CX.esc(detail.name||r.name)}</h3><div class="hint">已儲存到這台裝置的「我的活動」，正在開啟控制台…</div></div>`;
    setTimeout(()=>location.href=r.controlUrl,250);
  }catch(e){result.innerHTML=`<div class="error-box">${CX.esc(e.message)}</div>`;btn.disabled=false;btn.textContent='讀取活動';}
}
btn.onclick=load;codeEl.addEventListener('keydown',e=>{if(e.key==='Enter')load();});
</script></body></html>
