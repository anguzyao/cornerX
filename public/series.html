<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>活動控制台 — Corner X</title><link rel="stylesheet" href="/css/style.css">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/corner-x-scoreboard-icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="/assets/corner-x-scoreboard-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Corner X">
<link rel="manifest" href="/manifest.json"><style>
/* V13 — overall ranking: clean numeric rank + crown above #1 */
.overall-row { grid-template-columns: 52px 1fr auto 28px; }
.overall-movement{width:28px;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900;line-height:1}
.overall-movement.up{color:#ff4d4f}
.overall-movement.down{color:#22c55e}
.overall-movement.same{color:#8491a5;font-size:18px}
.overall-movement.new{color:#8491a5;font-size:18px}
@media(max-width:420px){.overall-row{grid-template-columns:44px minmax(0,1fr) auto 24px}.overall-movement{width:24px;font-size:21px}}
.overall-rank { position:relative; display:flex; align-items:center; justify-content:center; min-height:46px; font-family:'Rajdhani','Noto Sans TC',sans-serif; font-weight:900; font-size:28px; line-height:1; }
.overall-row.top-1 .overall-rank { color:var(--gold); }
.overall-row.top-2 .overall-rank { color:var(--silver); }
.overall-row.top-3 .overall-rank { color:var(--bronze); }
.overall-row.top-4 .overall-rank { color:var(--cyan); }
/* V14 — gold / silver / bronze crowns for top 3 */
.overall-row.top-1 .overall-rank::before, .overall-row.top-2 .overall-rank::before, .overall-row.top-3 .overall-rank::before { position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-family:Arial,sans-serif; font-size:21px; line-height:1; font-weight:900; }
.overall-row.top-1 .overall-rank::before { content:'♛'; color:var(--gold); text-shadow:0 0 7px rgba(255,209,102,.42); }
.overall-row.top-2 .overall-rank::before { content:'♛'; color:var(--silver); text-shadow:0 0 7px rgba(224,230,238,.34); }
.overall-row.top-3 .overall-rank::before { content:'♛'; color:var(--bronze); text-shadow:0 0 7px rgba(205,127,50,.34); }
.overall-row.top-1 .overall-rank::after { content:''; position:absolute; left:50%; bottom:3px; width:26px; height:2px; transform:translateX(-50%); border-radius:2px; background:var(--gold); opacity:.7; }
.overall-row:not(.top-1):not(.top-2):not(.top-3):not(.top-4) .overall-rank { color:var(--text); }
@media (max-width:420px) { .overall-row { grid-template-columns:44px 1fr auto; min-height:70px; padding:11px 12px; } .overall-rank { font-size:25px; } .overall-row.top-1 .overall-rank::before, .overall-row.top-2 .overall-rank::before, .overall-row.top-3 .overall-rank::before { top:-11px; font-size:18px; } }

/* V23 — match calling */
.call-panel{margin-top:14px;border:1px solid rgba(255,166,0,.28);background:linear-gradient(180deg,rgba(255,166,0,.08),rgba(255,166,0,.03));border-radius:14px;padding:16px}
.call-kicker{font-size:11px;letter-spacing:.12em;color:#f7b84b;font-weight:800}
.call-list{display:grid;gap:10px;margin-top:12px}
.call-item{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid rgba(255,255,255,.08);background:rgba(7,12,20,.34);border-radius:12px;padding:12px}
.call-item-main{min-width:0;flex:1}
.call-match-no{font-size:21px;font-weight:900;margin-top:0}
.call-players{font-size:17px;font-weight:800;margin:4px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call-status{font-size:13px;color:var(--muted,#9aa7b8)}
.call-btn{width:118px;min-height:44px;font-size:15px;font-weight:900;flex:0 0 auto}
.call-btn.called{background:rgba(255,166,0,.12);border:1px solid rgba(255,166,0,.5);color:#ffc45c}
@media(max-width:560px){.call-item{align-items:stretch;flex-direction:column}.call-btn{width:100%}.call-players{white-space:normal}}

/* V30 — independent format and roster for each new round */
.round-create-mask{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.round-create-sheet{width:min(620px,100%);max-height:92dvh;overflow:auto;background:var(--panel,#111923);border:1px solid rgba(100,170,230,.32);border-radius:18px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.5)}
.round-create-sheet h3{margin:0 0 6px}.round-create-field{display:grid;gap:8px;margin-top:16px}.round-create-field label{font-weight:800;color:var(--text,#eaf0f7)}
.round-create-field input[type=text],.round-create-field select,.round-create-field textarea{width:100%;min-height:44px;border:1px solid var(--line,rgba(255,255,255,.15));border-radius:10px;background:rgba(0,0,0,.18);color:var(--text,#eaf0f7);padding:10px 12px;font:inherit}
.round-format-options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.round-format-option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line,rgba(255,255,255,.15));border-radius:12px;cursor:pointer}.round-format-option:has(input:checked){border-color:var(--cyan,#43b7ff);background:rgba(67,183,255,.09)}
.round-roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:220px;overflow:auto;padding:2px}.round-roster label{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px;min-width:0;font-weight:500}.round-roster label span{overflow-wrap:anywhere}.round-create-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.round-roster-tools{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:480px){.round-create-sheet{padding:16px}.round-roster{grid-template-columns:1fr}.round-create-actions{flex-direction:column-reverse}.round-create-actions button{width:100%}}

/* V35 — team tournament creation and team-score modal */
.team-size-options{display:flex;gap:10px;flex-wrap:wrap}.team-size-options label{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--panel);font-weight:700}.team-method-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.team-name-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.team-name-field{display:grid;gap:6px}.team-name-field label{font-size:12px;color:var(--muted)}.team-name-field input{width:100%;min-width:0}.team-player-assignments{display:grid;gap:8px;margin-top:12px}.team-player-assignment{display:grid;grid-template-columns:minmax(0,1fr) minmax(115px,42%);gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--border);border-radius:9px;background:var(--panel)}.team-player-assignment span{overflow-wrap:anywhere;font-weight:600}.team-player-assignment select{width:100%;min-width:0}.team-score-grid{display:grid;grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr);gap:10px;align-items:start;margin:16px 0}.team-score-side{min-width:0;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--panel)}.team-score-side h4{margin:0 0 6px;font-size:17px;overflow-wrap:anywhere}.team-score-member{display:grid;gap:6px;margin-top:12px;font-size:13px}.team-score-member span{overflow-wrap:anywhere}.team-score-member input{width:100%;min-width:0;min-height:42px}.team-score-total{border-top:1px solid var(--border);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}.team-score-total strong{font-size:25px;color:var(--text)}.team-score-error{color:#ff7b72;background:rgba(255,90,80,.1);border:1px solid rgba(255,90,80,.3);border-radius:8px;padding:10px;margin-bottom:10px}.team-score-error[hidden]{display:none}@media(max-width:520px){.team-name-grid{grid-template-columns:1fr}.team-score-grid{grid-template-columns:minmax(0,1fr);}.team-score-grid .result-vs{text-align:center;padding:0}.team-score-side{padding:10px}.team-player-assignment{grid-template-columns:minmax(0,1fr) 44%}}

.round-management-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}.btn-danger{background:rgba(255,83,83,.12);border:1px solid rgba(255,83,83,.45);color:#ff8b8b}.btn-danger:hover{background:rgba(255,83,83,.2)}.round-management-actions .bracket-lock-hint{margin:0}
</style></head>
<body><div class="shell"><div class="topbar"><a class="back-btn" href="/">←</a><div><div class="eyebrow">PRIVATE CONTROL</div><div class="page-title" id="title">活動</div></div><button class="icon-btn" id="share">↗</button></div><div id="app"><div class="loading">載入中…</div></div></div>
<script src="/js/app.js"></script><script src="/js/bracket-view.js"></script>
<script>
const qs=new URLSearchParams(location.search), id=qs.get('id'), token=qs.get('token')||localStorage.getItem('cx_control_'+id);
if(token)localStorage.setItem('cx_control_'+id,token);
let state=null;
let currentTab='overall';
let selectedRoundId=null;
const app=document.getElementById('app');
function api(path,opts={}){return CX.api(path,{...opts,controlToken:token});}
function medal(rank){return ['🥇','🥈','🥉','4️⃣'][rank-1]||rank;}
function render(){
  if(!state)return;
  document.getElementById('title').textContent=state.name;
  const rounds=state.rounds||[], overall=state.overall||[];
  const accessCode=state.accessCode||'';
  const active=rounds.find(r=>r.status!=='done')||rounds[rounds.length-1];
  if(!selectedRoundId || !rounds.some(r=>r.id===selectedRoundId)) selectedRoundId=active?.id||null;
  app.innerHTML=`<div class="live-head"><div><div class="eyebrow">${state.status==='done'?'EVENT COMPLETE':'LIVE EVENT'}</div><h2>${CX.esc(state.name)}</h2><div class="muted">${CX.esc(state.eventDate||'')}${state.location?' · '+CX.esc(state.location):''}</div></div><div class="status-dot ${state.status==='done'?'done':''}">${state.status==='done'?'已完成':'進行中'}</div></div>
  <div class="tabbar"><button class="tab" data-tab="overall">總排行榜</button><button class="tab" data-tab="round">即時賽程</button><button class="tab" data-tab="points">本場積分</button></div>
  <div id="tab-content"></div>
  <div class="access-code-box"><div><div class="eyebrow accent">CROSS-DEVICE ACCESS</div><div class="access-code-label">活動代碼</div><div class="access-code">${CX.esc(accessCode||'--------')}</div><div class="hint">可在另一台手機／平板輸入此代碼，讀取並繼續操作本活動。</div></div><button class="btn btn-secondary btn-sm" id="copy-code">複製代碼</button></div><div class="section-actions"><button class="btn btn-secondary btn-sm" id="undo">↩ 復原上一個操作</button><button class="btn btn-secondary btn-sm" id="new-round">＋ 新增下一場</button><button class="btn btn-secondary btn-sm" id="copy">複製觀眾網址</button></div><div class="section-actions"><button class="btn btn-ghost btn-sm" id="finish">結束活動</button></div>`;
  const content=document.getElementById('tab-content');
  function show(tab){
    currentTab=tab;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
    const r=rounds.find(x=>x.id===selectedRoundId)||active;
    if(tab==='overall')renderOverall(content,overall,rounds);
    else if(tab==='round')renderRound(content,r,rounds,active);
    else renderPoints(content,r);
  }
  document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>show(x.dataset.tab));
  show(currentTab);

  document.getElementById('copy-code').onclick=async()=>{CX.toast(await CX.copy(accessCode)?'活動代碼已複製':'複製失敗');};
  document.getElementById('undo').onclick=async()=>{
    const r=rounds.find(x=>x.id===selectedRoundId)||active;if(!r)return;
    if(!confirm('確定復原上一個操作？'))return;
    try{await api(`/series/${id}/rounds/${r.id}/undo`,{method:'POST'});await load();}catch(e){CX.toast(e.message)}
  };
  document.getElementById('finish').onclick=async()=>{
    if(!confirm('確定結束活動？結束後仍可觀看，但不再新增場次。'))return;
    try{await api(`/series/${id}/finish`,{method:'POST'});await load();}catch(e){CX.toast(e.message)}
  };
  document.getElementById('new-round').onclick=()=>openCreateRoundModal(rounds.length+1);
  document.getElementById('copy').onclick=async()=>{const u=location.origin+'/series-public/'+state.shareSlug;CX.toast(await CX.copy(u)?'已複製觀眾網址':'複製失敗');};
}
function openCreateRoundModal(nextNo){
  const roster=Array.isArray(state?.participants)?state.participants:[];
  const mask=document.createElement('div');mask.className='round-create-mask';
  mask.innerHTML=`<section class="round-create-sheet" role="dialog" aria-modal="true" aria-label="新增賽事">
    <h3>新增比賽</h3><div class="hint">選擇個人賽或團體賽。未參加本場的選手仍保留歷史積分。</div>
    <div class="round-create-field"><label for="round-name">比賽名稱</label><input id="round-name" type="text" maxlength="80" value="第 ${nextNo} 場"></div>
    <div class="round-create-field"><label>賽制</label><div class="round-format-options"><label class="round-format-option"><input type="radio" name="round-format" value="single" checked><span><strong>單淘汰</strong><br><small>個人賽</small></span></label><label class="round-format-option"><input type="radio" name="round-format" value="double"><span><strong>雙淘汰</strong><br><small>個人賽</small></span></label><label class="round-format-option"><input type="radio" name="round-format" value="team"><span><strong>團體賽</strong><br><small>團隊單淘汰</small></span></label></div></div>
    <div id="team-options" hidden><div class="round-create-field"><label>團體人數</label><div class="team-size-options"><label><input type="radio" name="team-size" value="2" checked> 雙人組</label><label><input type="radio" name="team-size" value="3"> 三人組</label></div></div></div>
    <div class="round-create-field"><label>參賽選手</label><div class="round-roster-tools"><button type="button" class="btn btn-secondary btn-sm" id="roster-all">全選</button><button type="button" class="btn btn-secondary btn-sm" id="roster-none">全不選</button></div><div class="round-roster" id="round-roster">${roster.map(p=>`<label><input type="checkbox" value="${CX.esc(p.name)}" checked><span>${CX.esc(p.name)}</span></label>`).join('')}</div></div>
    <div class="round-create-field"><label for="round-new-players">新增選手（每行一位）</label><textarea id="round-new-players" rows="3" placeholder="輸入本場新加入的選手名稱，一行一位"></textarea></div>
    <div id="team-builder" hidden><div class="round-create-field"><div class="team-method-row"><button type="button" class="btn btn-secondary btn-sm" id="team-manual">手動分隊</button><button type="button" class="btn btn-primary btn-sm" id="team-random">🎲 隨機分隊</button></div><div class="hint">預設 A小隊、B小隊……。可直接編輯隊名，並用每位選手旁的選單手動調整分隊。</div><div id="team-assignment-area"></div></div></div>
    <div class="round-create-actions"><button class="btn btn-secondary" id="round-cancel">取消</button><button class="btn btn-primary" id="round-create-submit">建立比賽</button></div>
  </section>`;
  document.body.appendChild(mask);
  const close=()=>mask.remove();
  let method='manual';
  mask.querySelector('#round-cancel').onclick=close;
  mask.addEventListener('click',e=>{if(e.target===mask)close()});
  mask.querySelector('#roster-all').onclick=()=>{mask.querySelectorAll('#round-roster input[type=checkbox]').forEach(x=>x.checked=true);updateTeamBuilder()};
  mask.querySelector('#roster-none').onclick=()=>{mask.querySelectorAll('#round-roster input[type=checkbox]').forEach(x=>x.checked=false);updateTeamBuilder()};
  mask.querySelectorAll('input[name="round-format"]').forEach(x=>x.onchange=()=>{const team=x.value==='team'&&x.checked;mask.querySelector('#team-options').hidden=!team;mask.querySelector('#team-builder').hidden=!team;updateTeamBuilder()});
  mask.querySelectorAll('input[name="team-size"]').forEach(x=>x.onchange=updateTeamBuilder);
  mask.querySelector('#round-roster').onchange=updateTeamBuilder;
  mask.querySelector('#round-new-players').oninput=updateTeamBuilder;
  mask.querySelector('#team-manual').onclick=()=>{method='manual';updateTeamBuilder()};
  mask.querySelector('#team-random').onclick=()=>{method='random';updateTeamBuilder(true)};
  function selectedPlayers(){
    const picked=[...mask.querySelectorAll('#round-roster input[type=checkbox]:checked')].map(x=>x.value);
    const added=mask.querySelector('#round-new-players').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    return [...picked,...added];
  }
  function updateTeamBuilder(randomize=false){
    if(mask.querySelector('input[name="round-format"]:checked')?.value!=='team')return;
    const players=selectedPlayers(), size=Number(mask.querySelector('input[name="team-size"]:checked')?.value||2), count=Math.ceil(players.length/size), area=mask.querySelector('#team-assignment-area');
    let order=players.slice();
    if(randomize){for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}}
    area.innerHTML=`<div class="team-name-grid">${Array.from({length:count},(_,i)=>`<div class="team-name-field"><label>隊伍 ${i+1}</label><input data-team-name="${i}" value="${String.fromCharCode(65+i)}小隊" /></div>`).join('')}</div><div class="team-player-assignments">${order.map((name,i)=>`<div class="team-player-assignment"><span>${CX.esc(name)}</span><select data-player-index="${i}" data-player-value="${CX.esc(name)}">${Array.from({length:count},(_,ti)=>`<option value="${ti}" ${Math.min(Math.floor(i/size),count-1)===ti?'selected':''}>${String.fromCharCode(65+ti)}小隊</option>`).join('')}</select></div>`).join('')}</div>`;
    area.querySelectorAll('[data-team-name]').forEach(inp=>inp.oninput=()=>{const i=Number(inp.dataset.teamName);area.querySelectorAll(`[data-player-index] option[value="${i}"]`).forEach(o=>o.textContent=inp.value.trim()||`${String.fromCharCode(65+i)}小隊`)});
  }
  mask.querySelector('#round-create-submit').onclick=async()=>{
    const btn=mask.querySelector('#round-create-submit');btn.disabled=true;
    const name=mask.querySelector('#round-name').value.trim();
    const format=mask.querySelector('input[name="round-format"]:checked')?.value||'single';
    const players=selectedPlayers();
    if(!name){CX.toast('請輸入比賽名稱');btn.disabled=false;return}
    if(new Set(players).size!==players.length){CX.toast('參賽名單有重複名稱，請檢查');btn.disabled=false;return}
    try{
      let body;
      if(format==='team'){
        const size=Number(mask.querySelector('input[name="team-size"]:checked')?.value||2);
        if(players.length<size*2){throw new Error('至少需要兩支完整隊伍');}
        if(players.length%size!==0)throw new Error(`目前有 ${players.length} 位選手，無法平均分成每隊 ${size} 人，請增減選手`);
        const count=players.length/size, teamList=Array.from({length:count},(_,i)=>({name:mask.querySelector(`[data-team-name="${i}"]`)?.value.trim()||`${String.fromCharCode(65+i)}小隊`,members:[]}));
        const selectors=[...mask.querySelectorAll('[data-player-index]')];
        if(selectors.length!==players.length)throw new Error('分隊清單尚未完成，請重新選擇團體賽');
        selectors.forEach(sel=>{const pname=sel.dataset.playerValue;teamList[Number(sel.value)].members.push(pname)});
        if(teamList.some(t=>t.members.length!==size))throw new Error(`每隊必須剛好 ${size} 人，請調整分隊`);
        if(new Set(teamList.map(t=>t.name)).size!==teamList.length)throw new Error('隊伍名稱不可重複');
        body={name,format:'team',teamSize:size,teams:teamList};
      }else{
        if(players.length<2)throw new Error('本場至少需要 2 位參賽者');
        body={name,format,players};
      }
      const res=await api(`/series/${id}/rounds`,{method:'POST',body});selectedRoundId=res.id;currentTab='round';close();await load();CX.toast(format==='team'?'已建立團體單淘汰賽':'已建立比賽');
    }catch(e){btn.disabled=false;CX.toast(e.message)}
  };
  mask.querySelector('#round-name').focus();
}

function renderOverall(el,rows){
  el.innerHTML=`<div class="panel"><div class="section-title">累積積分</div><div class="hint">總積分排行榜</div><div class="overall-list">${rows.map(x=>{
    const top=x.overallRank<=4?` top-${x.overallRank}`:'';
    // rankChange is previous completed cumulative rank minus current rank: positive means moving up.
    const hasPrevious=x.previousRank!==null&&x.previousRank!==undefined;
    const movement=!hasPrevious?'<span class="overall-movement new" title="尚無可比較的歷史排名">—</span>':x.rankChange>0?'<span class="overall-movement up" title="名次上升">↑</span>':x.rankChange<0?'<span class="overall-movement down" title="名次下降">↓</span>':'<span class="overall-movement same" title="名次不變">—</span>';
    return `<div class="overall-row${top}"><div class="overall-rank">${x.overallRank}</div><div class="overall-player">${CX.esc(x.name)}</div><div class="overall-total">${x.total}</div>${movement}</div>`;
  }).join('')}</div></div>`;
}
function firstRoundPlayers(r){
  if(!r?.data?.matches)return [];
  return r.data.matches.filter(m=>m.stage==='WB'&&m.round===1).sort((a,b)=>a.index-b.index).flatMap(m=>[m.playerA,m.playerB]).filter(p=>p&&p!=='__BYE__');
}
function callMatchOrder(matches){
  const wbRounds=matches.filter(m=>m.stage==='WB').map(m=>m.round||0);
  const finalRound=wbRounds.length?Math.max(...wbRounds):0;
  const stageRank=m=>{
    if(m.stage==='WB'&&m.round===finalRound)return 3;
    if(m.stage==='TP')return 2;
    if(m.stage==='GF')return 3;
    if(m.stage==='LB')return 1;
    return 0;
  };
  return matches.filter(m=>m.playerA&&m.playerB&&m.playerA!=='__BYE__'&&m.playerB!=='__BYE__')
    .sort((a,b)=>{
      const ka=[stageRank(a),a.round||0,a.index||0],kb=[stageRank(b),b.round||0,b.index||0];
      for(let i=0;i<ka.length;i++)if(ka[i]!==kb[i])return ka[i]-kb[i];
      return String(a.id).localeCompare(String(b.id));
    });
}
function getCallCandidates(r){
  return callMatchOrder(r?.data?.matches||[]).filter(m=>m.status==='ready');
}
function renderCallPanel(r){
  const box=document.createElement('div'); box.className='call-panel';
  const ready=getCallCandidates(r).slice(0,4);
  const calls=Array.isArray(r?.data?.calls)?r.data.calls:(r?.data?.call?[r.data.call]:[]);
  if(!ready.length){
    box.innerHTML='<div class="call-kicker">📢 MATCH CALL · 選手叫號</div><div class="call-status">目前沒有可叫號的比賽。</div>';
    return box;
  }
  box.innerHTML=`<div class="call-kicker">📢 MATCH CALL · 目前＋接下來 3 場</div><div class="call-list"></div>`;
  const list=box.querySelector('.call-list');
  ready.forEach((target,idx)=>{
    const order=callMatchOrder(r.data.matches).findIndex(m=>m.id===target.id)+1;
    const called=calls.some(c=>c&&c.matchId===target.id);
    const item=document.createElement('div'); item.className='call-item';
    const teamA=r.data.teamMode?r.data.teams?.[target.playerA]:null, teamB=r.data.teamMode?r.data.teams?.[target.playerB]:null;
    const displayTeam=(name,team)=>`${CX.esc(name)}${team?.members?.length?`<span class="team-members call-team-members">隊員：${team.members.map(CX.esc).join('、')}</span>`:''}`;
    item.innerHTML=`<div class="call-item-main"><div class="call-match-no">第 ${order} 場</div><div class="call-players call-team-players"><div>${displayTeam(target.playerA,teamA)}</div><span class="call-vs-inline">VS</span><div>${displayTeam(target.playerB,teamB)}</div></div><div class="call-status">${called?'已叫號，可再次播送。':'等待叫號。'}</div></div><button class="btn btn-primary call-btn ${called?'called':''}">${called?'🔊 再次叫號':'📢 叫號'}</button>`;
    item.querySelector('.call-btn').onclick=async()=>{
      const btn=item.querySelector('.call-btn'); btn.disabled=true;
      try{
        await api(`/series/${id}/rounds/${r.id}/call`,{method:'POST',body:{matchId:target.id,matchNo:order,playerA:target.playerA,playerB:target.playerB}});
        await load(); CX.toast(`第 ${order} 場已發送叫號`);
      }catch(e){btn.disabled=false;CX.toast(e.message)}
    };
    list.appendChild(item);
  });
  return box;
}
function renderRound(el,r,rounds,active){
  if(!r){el.innerHTML='<div class="empty-state">尚未建立賽程</div>';return}
  const editable=r.status!=='done';
  const hasPlayed=(r.data?.matches||[]).some(m=>m.status==='done'&&m.winner&&m.playerA!=='__BYE__'&&m.playerB!=='__BYE__');
  const canReseed=editable&&!hasPlayed&&!r.data?.teamMode;
  el.innerHTML=`<div class="panel"><div class="round-switcher">${rounds.map(x=>`<button class="round-chip ${x.id===r.id?'active':''}" data-round-id="${x.id}">第${x.round_no}場${x.status==='done'?' ✓':' · 進行中'}</button>`).join('')}</div><div class="round-head"><div><div class="eyebrow">ROUND ${r.round_no}</div><h3>${CX.esc(r.name)}</h3></div><span class="badge ${r.status==='done'?'done':'ongoing'}">${r.status==='done'?'已完成':'進行中'}</span></div><div class="round-management-actions">${canReseed?`<button class="btn btn-secondary btn-sm" id="randomize">🎲 隨機排序</button><button class="btn btn-secondary btn-sm" id="manual-seed">⚙ 手動調整對位</button>`:(!r.data?.teamMode&&!editable||hasPlayed?'<span class="bracket-lock-hint">🔒 已有比賽結果，對位已鎖定</span>':'')}<button class="btn btn-danger btn-sm" id="delete-round">🗑 刪除此場比賽</button></div><div id="bracket"></div></div>`;
  el.querySelectorAll('.round-chip').forEach(btn=>btn.onclick=()=>{selectedRoundId=btn.dataset.roundId;render();});
  document.getElementById('delete-round').onclick=async()=>{
    const warning=`確定刪除「${r.name}」？\n\n本場賽程、比賽結果及本場所有積分都會一併刪除，總排行榜會同步扣除本場積分。此操作無法復原。`;
    if(!confirm(warning))return;
    try{await api(`/series/${id}/rounds/${r.id}`,{method:'DELETE'});selectedRoundId=null;currentTab='round';await load();CX.toast('本場比賽及其積分已刪除');}catch(e){CX.toast(e.message)}
  };
  if(canReseed){
    document.getElementById('randomize').onclick=async()=>{
      if(!confirm('重新隨機後，目前尚未開始的對位會全部重新產生。確定要重新抽籤嗎？'))return;
      try{await api(`/series/${id}/rounds/${r.id}/reseed`,{method:'POST',body:{mode:'random'}});currentTab='round';selectedRoundId=r.id;await load();CX.toast('已重新隨機排序');}catch(e){CX.toast(e.message)}
    };
    document.getElementById('manual-seed').onclick=()=>openManualSeedModal(r);
  }
  CXBracket.renderBracket(document.getElementById('bracket'),r.data,{editable:editable,onRecord:async mid=>{
    const m=r.data.matches.find(x=>x.id===mid);if(!m)return;
    if(r.data.teamMode){CXBracket.openTeamScoreModal(m,r.data.teams,async(memberScores,scoreA,scoreB)=>{try{await api(`/series/${id}/rounds/${r.id}/matches/${mid}/result`,{method:'POST',body:{scoreA,scoreB,memberScores}});currentTab='round';selectedRoundId=r.id;await load();}catch(e){CX.toast(e.message);throw e;}})}
    else CXBracket.openScoreModal(m,async(a,b)=>{try{await api(`/series/${id}/rounds/${r.id}/matches/${mid}/result`,{method:'POST',body:{scoreA:a,scoreB:b}});currentTab='round';selectedRoundId=r.id;await load();}catch(e){CX.toast(e.message);throw e;}},async(slot)=>{try{await api(`/series/${id}/rounds/${r.id}/matches/${mid}/result`,{method:'POST',body:{winner:slot}});currentTab='round';selectedRoundId=r.id;await load();}catch(e){CX.toast(e.message);throw e;}});
  }});
  document.getElementById('bracket').appendChild(renderCallPanel(r));
}
function openManualSeedModal(r){
  const players=firstRoundPlayers(r);let order=players.slice();let first=null;
  const mask=document.createElement('div');mask.className='modal-mask center';
  const render=()=>{mask.querySelector('.manual-seed-list').innerHTML=order.map((name,i)=>`<button class="seed-player ${first===i?'selected':''}" data-i="${i}"><span>${i+1}</span><strong>${CX.esc(name)}</strong></button>`).join('');};
  mask.innerHTML=`<div class="modal-sheet manual-seed-modal" style="position:relative"><span class="modal-close">✕</span><h3>手動調整對位</h3><div class="hint">點兩位選手即可交換位置。調整完成後按「確認對位」。</div><div class="manual-seed-list"></div><div class="modal-actions"><button class="btn btn-secondary" id="seed-cancel">取消</button><button class="btn btn-primary" id="seed-save">確認對位</button></div></div>`;
  document.body.appendChild(mask);render();
  const close=()=>mask.remove();mask.querySelector('.modal-close').onclick=close;mask.querySelector('#seed-cancel').onclick=close;
  mask.querySelector('.manual-seed-list').onclick=(e)=>{const btn=e.target.closest('.seed-player');if(!btn)return;const i=Number(btn.dataset.i);if(first===null){first=i;render();return;}if(first===i){first=null;render();return;}[order[first],order[i]]=[order[i],order[first]];first=null;render();};
  mask.querySelector('#seed-save').onclick=async()=>{try{await api(`/series/${id}/rounds/${r.id}/reseed`,{method:'POST',body:{mode:'manual',players:order}});close();currentTab='round';selectedRoundId=r.id;await load();CX.toast('對位已更新');}catch(e){CX.toast(e.message)}};
}
async function renderPoints(el,r){if(!r||r.status!=='done'){el.innerHTML='<div class="empty-state">本場完成後會自動產生積分</div>';return} const q=await api(`/series/${id}/rounds/${r.id}/points`);el.innerHTML=`<div class="panel"><div class="section-title">${CX.esc(r.name)} · 積分</div><div class="hint">系統依排名自動帶入，你可以在鎖定前手動修改。</div><div class="points-list">${q.points.map(x=>`<div class="point-row"><span class="rank">${medal(x.rank)}</span><span class="player">${CX.esc(x.name)}</span><input data-pid="${x.participant_id}" type="number" min="0" value="${x.points}" ${q.locked?'disabled':''}><span class="source">${x.source==='manual'?'手動':'自動'}</span></div>`).join('')}</div>${q.locked?'<div class="locked">🔒 本場積分已鎖定</div>':'<button class="btn btn-primary" id="confirm-points">確認並鎖定本場積分</button>'}</div>`;el.querySelectorAll('input[data-pid]').forEach(inp=>inp.onchange=async()=>{try{await api(`/series/${id}/rounds/${r.id}/points/${inp.dataset.pid}`,{method:'PATCH',body:{points:Number(inp.value)}});CX.toast('積分已更新')}catch(e){CX.toast(e.message)}});const b=document.getElementById('confirm-points');if(b)b.onclick=async()=>{try{await api(`/series/${id}/rounds/${r.id}/points/confirm`,{method:'POST'});currentTab='points';selectedRoundId=r.id;await load();}catch(e){CX.toast(e.message)}}}
async function load(){try{state=await api(`/series/${id}`);render();}catch(e){app.innerHTML=`<div class="error-box">${CX.esc(e.message)}</div>`}};
document.getElementById('share').onclick=async()=>{try{const r=await api(`/series/${id}/share`,{method:'POST'});await CX.copy(location.origin+r.url);CX.toast('觀眾網址已複製');}catch(e){CX.toast(e.message)}};
load();
</script></body></html>
