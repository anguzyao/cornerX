<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>活動控制台 — Corner X</title><link rel="stylesheet" href="/css/style.css"><style>
/* V13 — overall ranking: clean numeric rank + crown above #1 */
.overall-row { grid-template-columns: 52px 1fr auto; }
.overall-rank { position:relative; display:flex; align-items:center; justify-content:center; min-height:46px; font-family:'Rajdhani','Noto Sans TC',sans-serif; font-weight:900; font-size:28px; line-height:1; }
.overall-row.top-1 .overall-rank { color:var(--gold); }
.overall-row.top-2 .overall-rank { color:var(--silver); }
.overall-row.top-3 .overall-rank { color:var(--bronze); }
.overall-row.top-4 .overall-rank { color:var(--cyan); }
/* V14 — gold / silver / bronze crowns for top 3 */
.overall-row.top-1 .overall-rank::before, .overall-row.top-2 .overall-rank::before, .overall-row.top-3 .overall-rank::before { position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-family:Arial,sans-serif; font-size:21px; line-height:1; font-weight:900; }
.overall-row.top-1 .overall-rank::before { content:'♛'; color:var(--gold); text-shadow:0 0 7px rgba(255,209,102,.42); }
.overall-row.top-2 .overall-rank::before { content:'♛'; color:var(--silver); text-shadow:0 0 7px rgba(224,230,238,.34); }
.overall-row.top-3 .overall-rank::before { content:'♛'; color:var(--bronze); text-shadow:0 0 7px rgba(205,127,50,.34); }
.overall-row.top-1 .overall-rank::after { content:''; position:absolute; left:50%; bottom:3px; width:26px; height:2px; transform:translateX(-50%); border-radius:2px; background:var(--gold); opacity:.7; }
.overall-row:not(.top-1):not(.top-2):not(.top-3):not(.top-4) .overall-rank { color:var(--text); }
@media (max-width:420px) { .overall-row { grid-template-columns:44px 1fr auto; min-height:70px; padding:11px 12px; } .overall-rank { font-size:25px; } .overall-row.top-1 .overall-rank::before, .overall-row.top-2 .overall-rank::before, .overall-row.top-3 .overall-rank::before { top:-11px; font-size:18px; } }
</style></head>
<body><div class="shell"><div class="topbar"><a class="back-btn" href="/">←</a><div><div class="eyebrow">PRIVATE CONTROL</div><div class="page-title" id="title">活動</div></div><button class="icon-btn" id="share">↗</button></div><div id="app"><div class="loading">載入中…</div></div></div>
<script src="/js/app.js"></script><script src="/js/bracket-view.js"></script>
<script>
const qs=new URLSearchParams(location.search), id=qs.get('id'), token=qs.get('token')||localStorage.getItem('cx_control_'+id);
if(token)localStorage.setItem('cx_control_'+id,token);
let state=null;
let currentTab='overall';
let selectedRoundId=null;
const app=document.getElementById('app');
function api(path,opts={}){return CX.api(path,{...opts,controlToken:token});}
function medal(rank){return ['🥇','🥈','🥉','4️⃣'][rank-1]||rank;}
function render(){
  if(!state)return;
  document.getElementById('title').textContent=state.name;
  const rounds=state.rounds||[], overall=state.overall||[];
  const accessCode=state.accessCode||'';
  const active=rounds.find(r=>r.status!=='done')||rounds[rounds.length-1];
  if(!selectedRoundId || !rounds.some(r=>r.id===selectedRoundId)) selectedRoundId=active?.id||null;
  app.innerHTML=`<div class="live-head"><div><div class="eyebrow">${state.status==='done'?'EVENT COMPLETE':'LIVE EVENT'}</div><h2>${CX.esc(state.name)}</h2><div class="muted">${CX.esc(state.eventDate||'')}${state.location?' · '+CX.esc(state.location):''}</div></div><div class="status-dot ${state.status==='done'?'done':''}">${state.status==='done'?'已完成':'進行中'}</div></div>
  <div class="tabbar"><button class="tab" data-tab="overall">總排行榜</button><button class="tab" data-tab="round">即時賽程</button><button class="tab" data-tab="points">本場積分</button></div>
  <div id="tab-content"></div>
  <div class="access-code-box"><div><div class="eyebrow accent">CROSS-DEVICE ACCESS</div><div class="access-code-label">活動代碼</div><div class="access-code">${CX.esc(accessCode||'--------')}</div><div class="hint">可在另一台手機／平板輸入此代碼，讀取並繼續操作本活動。</div></div><button class="btn btn-secondary btn-sm" id="copy-code">複製代碼</button></div><div class="section-actions"><button class="btn btn-secondary btn-sm" id="undo">↩ 復原上一個操作</button><button class="btn btn-secondary btn-sm" id="new-round">＋ 新增下一場</button><button class="btn btn-secondary btn-sm" id="copy">複製觀眾網址</button></div><div class="section-actions"><button class="btn btn-ghost btn-sm" id="finish">結束活動</button></div>`;
  const content=document.getElementById('tab-content');
  function show(tab){
    currentTab=tab;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));
    const r=rounds.find(x=>x.id===selectedRoundId)||active;
    if(tab==='overall')renderOverall(content,overall,rounds);
    else if(tab==='round')renderRound(content,r,rounds,active);
    else renderPoints(content,r);
  }
  document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>show(x.dataset.tab));
  show(currentTab);

  document.getElementById('copy-code').onclick=async()=>{CX.toast(await CX.copy(accessCode)?'活動代碼已複製':'複製失敗');};
  document.getElementById('undo').onclick=async()=>{
    const r=rounds.find(x=>x.id===selectedRoundId)||active;if(!r)return;
    if(!confirm('確定復原上一個操作？'))return;
    try{await api(`/series/${id}/rounds/${r.id}/undo`,{method:'POST'});await load();}catch(e){CX.toast(e.message)}
  };
  document.getElementById('finish').onclick=async()=>{
    if(!confirm('確定結束活動？結束後仍可觀看，但不再新增場次。'))return;
    try{await api(`/series/${id}/finish`,{method:'POST'});await load();}catch(e){CX.toast(e.message)}
  };
  document.getElementById('new-round').onclick=async()=>{
    const name=prompt('本場名稱',`第 ${rounds.length+1} 場`);if(name===null)return;
    try{const res=await api(`/series/${id}/rounds`,{method:'POST',body:{name,format:'single'}});selectedRoundId=res.id;currentTab='round';await load();}catch(e){CX.toast(e.message)}
  };
  document.getElementById('copy').onclick=async()=>{const u=location.origin+'/series-public/'+state.shareSlug;CX.toast(await CX.copy(u)?'已複製觀眾網址':'複製失敗');};
}
function renderOverall(el,rows){
  el.innerHTML=`<div class="panel"><div class="section-title">累積積分</div><div class="hint">總積分排行榜</div><div class="overall-list">${rows.map(x=>{
    const top=x.overallRank<=4?` top-${x.overallRank}`:'';
    return `<div class="overall-row${top}"><div class="overall-rank">${x.overallRank}</div><div class="overall-player">${CX.esc(x.name)}</div><div class="overall-total">${x.total}</div></div>`;
  }).join('')}</div></div>`;
}
function firstRoundPlayers(r){
  if(!r?.data?.matches)return [];
  return r.data.matches.filter(m=>m.stage==='WB'&&m.round===1).sort((a,b)=>a.index-b.index).flatMap(m=>[m.playerA,m.playerB]).filter(p=>p&&p!=='__BYE__');
}
function renderRound(el,r,rounds,active){
  if(!r){el.innerHTML='<div class="empty-state">尚未建立賽程</div>';return}
  const editable=r.status!=='done';
  const hasPlayed=(r.data?.matches||[]).some(m=>m.status==='done'&&m.scoreA!==null&&m.scoreA!==undefined&&m.scoreB!==null&&m.scoreB!==undefined);
  const canReseed=editable&&!hasPlayed;
  el.innerHTML=`<div class="panel"><div class="round-switcher">${rounds.map(x=>`<button class="round-chip ${x.id===r.id?'active':''}" data-round-id="${x.id}">第${x.round_no}場${x.status==='done'?' ✓':' · 進行中'}</button>`).join('')}</div><div class="round-head"><div><div class="eyebrow">ROUND ${r.round_no}</div><h3>${CX.esc(r.name)}</h3></div><span class="badge ${r.status==='done'?'done':'ongoing'}">${r.status==='done'?'已完成':'進行中'}</span></div>${canReseed?`<div class="bracket-tools"><button class="btn btn-secondary btn-sm" id="randomize">🎲 隨機排序</button><button class="btn btn-secondary btn-sm" id="manual-seed">⚙ 手動調整對位</button></div>`:'<div class="bracket-lock-hint">🔒 已有比賽結果，對位已鎖定</div>'}<div id="bracket"></div></div>`;
  el.querySelectorAll('.round-chip').forEach(btn=>btn.onclick=()=>{selectedRoundId=btn.dataset.roundId;render();});
  if(canReseed){
    document.getElementById('randomize').onclick=async()=>{
      if(!confirm('重新隨機後，目前尚未開始的對位會全部重新產生。確定要重新抽籤嗎？'))return;
      try{await api(`/series/${id}/rounds/${r.id}/reseed`,{method:'POST',body:{mode:'random'}});currentTab='round';selectedRoundId=r.id;await load();CX.toast('已重新隨機排序');}catch(e){CX.toast(e.message)}
    };
    document.getElementById('manual-seed').onclick=()=>openManualSeedModal(r);
  }
  CXBracket.renderBracket(document.getElementById('bracket'),r.data,{editable:editable,onRecord:async mid=>{
    const m=r.data.matches.find(x=>x.id===mid);if(!m)return;
    CXBracket.openScoreModal(m,async(a,b)=>{try{await api(`/series/${id}/rounds/${r.id}/matches/${mid}/result`,{method:'POST',body:{scoreA:a,scoreB:b}});currentTab='round';selectedRoundId=r.id;await load();}catch(e){CX.toast(e.message);throw e;}},async(slot)=>{try{await api(`/series/${id}/rounds/${r.id}/matches/${mid}/result`,{method:'POST',body:{winner:slot}});currentTab='round';selectedRoundId=r.id;await load();}catch(e){CX.toast(e.message);throw e;}});
  }});
}
function openManualSeedModal(r){
  const players=firstRoundPlayers(r);let order=players.slice();let first=null;
  const mask=document.createElement('div');mask.className='modal-mask center';
  const render=()=>{mask.querySelector('.manual-seed-list').innerHTML=order.map((name,i)=>`<button class="seed-player ${first===i?'selected':''}" data-i="${i}"><span>${i+1}</span><strong>${CX.esc(name)}</strong></button>`).join('');};
  mask.innerHTML=`<div class="modal-sheet manual-seed-modal" style="position:relative"><span class="modal-close">✕</span><h3>手動調整對位</h3><div class="hint">點兩位選手即可交換位置。調整完成後按「確認對位」。</div><div class="manual-seed-list"></div><div class="modal-actions"><button class="btn btn-secondary" id="seed-cancel">取消</button><button class="btn btn-primary" id="seed-save">確認對位</button></div></div>`;
  document.body.appendChild(mask);render();
  const close=()=>mask.remove();mask.querySelector('.modal-close').onclick=close;mask.querySelector('#seed-cancel').onclick=close;
  mask.querySelector('.manual-seed-list').onclick=(e)=>{const btn=e.target.closest('.seed-player');if(!btn)return;const i=Number(btn.dataset.i);if(first===null){first=i;render();return;}if(first===i){first=null;render();return;}[order[first],order[i]]=[order[i],order[first]];first=null;render();};
  mask.querySelector('#seed-save').onclick=async()=>{try{await api(`/series/${id}/rounds/${r.id}/reseed`,{method:'POST',body:{mode:'manual',players:order}});close();currentTab='round';selectedRoundId=r.id;await load();CX.toast('對位已更新');}catch(e){CX.toast(e.message)}};
}
async function renderPoints(el,r){if(!r||r.status!=='done'){el.innerHTML='<div class="empty-state">本場完成後會自動產生積分</div>';return} const q=await api(`/series/${id}/rounds/${r.id}/points`);el.innerHTML=`<div class="panel"><div class="section-title">${CX.esc(r.name)} · 積分</div><div class="hint">系統依排名自動帶入，你可以在鎖定前手動修改。</div><div class="points-list">${q.points.map(x=>`<div class="point-row"><span class="rank">${medal(x.rank)}</span><span class="player">${CX.esc(x.name)}</span><input data-pid="${x.participant_id}" type="number" min="0" value="${x.points}" ${q.locked?'disabled':''}><span class="source">${x.source==='manual'?'手動':'自動'}</span></div>`).join('')}</div>${q.locked?'<div class="locked">🔒 本場積分已鎖定</div>':'<button class="btn btn-primary" id="confirm-points">確認並鎖定本場積分</button>'}</div>`;el.querySelectorAll('input[data-pid]').forEach(inp=>inp.onchange=async()=>{try{await api(`/series/${id}/rounds/${r.id}/points/${inp.dataset.pid}`,{method:'PATCH',body:{points:Number(inp.value)}});CX.toast('積分已更新')}catch(e){CX.toast(e.message)}});const b=document.getElementById('confirm-points');if(b)b.onclick=async()=>{try{await api(`/series/${id}/rounds/${r.id}/points/confirm`,{method:'POST'});currentTab='points';selectedRoundId=r.id;await load();}catch(e){CX.toast(e.message)}}}
async function load(){try{state=await api(`/series/${id}`);render();}catch(e){app.innerHTML=`<div class="error-box">${CX.esc(e.message)}</div>`}};
document.getElementById('share').onclick=async()=>{try{const r=await api(`/series/${id}/share`,{method:'POST'});await CX.copy(location.origin+r.url);CX.toast('觀眾網址已複製');}catch(e){CX.toast(e.message)}};
load();
</script></body></html>
