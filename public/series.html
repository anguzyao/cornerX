<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>活動控制台 — Corner X</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="shell"><div class="topbar"><a class="back-btn" href="/">←</a><div><div class="eyebrow">PRIVATE CONTROL</div><div class="page-title" id="title">活動</div></div><button class="icon-btn" id="share">↗</button></div><div id="app"><div class="loading">載入中…</div></div></div>
<script src="/js/app.js"></script><script src="/js/bracket-view.js"></script>
<script>
const qs=new URLSearchParams(location.search), id=qs.get('id'), token=qs.get('token')||localStorage.getItem('cx_control_'+id); if(token)localStorage.setItem('cx_control_'+id,token); let state=null;
const app=document.getElementById('app');
function api(path,opts={}){return CX.api(path,{...opts,controlToken:token});}
function medal(rank){return ['🥇','🥈','🥉','4️⃣'][rank-1]||rank;}
function render(){if(!state)return; document.getElementById('title').textContent=state.name; const rounds=state.rounds||[], overall=state.overall||[]; const active=rounds.find(r=>r.status!=='done')||rounds[rounds.length-1];
 app.innerHTML=`<div class="live-head"><div><div class="eyebrow">${state.status==='done'?'EVENT COMPLETE':'LIVE EVENT'}</div><h2>${CX.esc(state.name)}</h2><div class="muted">${CX.esc(state.eventDate||'')}${state.location?' · '+CX.esc(state.location):''}</div></div><div class="status-dot ${state.status==='done'?'done':''}">${state.status==='done'?'已完成':'進行中'}</div></div>
 <div class="tabbar"><button class="tab active" data-tab="overall">總排行榜</button><button class="tab" data-tab="round">即時賽程</button><button class="tab" data-tab="points">本場積分</button></div>
 <div id="tab-content"></div>
 <div class="section-actions"><button class="btn btn-secondary btn-sm" id="undo">↩ 復原上一個操作</button><button class="btn btn-secondary btn-sm" id="new-round">＋ 新增下一場</button><button class="btn btn-secondary btn-sm" id="copy">複製觀眾網址</button></div><div class="section-actions"><button class="btn btn-ghost btn-sm" id="finish">結束活動</button></div>`;
 const content=document.getElementById('tab-content');
 function show(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab)); if(tab==='overall')renderOverall(content,overall,rounds); else if(tab==='round')renderRound(content,active); else renderPoints(content,active);}
 document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>show(x.dataset.tab)); show('overall');
 document.getElementById('undo').onclick=async()=>{const r=active;if(!r)return;if(!confirm('確定復原上一個操作？'))return;try{await api(`/series/${id}/rounds/${r.id}/undo`,{method:'POST'});await load();}catch(e){CX.toast(e.message)}};
 document.getElementById('finish').onclick=async()=>{if(!confirm('確定結束活動？結束後仍可觀看，但不再新增場次。'))return;try{await api(`/series/${id}/finish`,{method:'POST'});await load();}catch(e){CX.toast(e.message)}};
 document.getElementById('new-round').onclick=async()=>{const name=prompt('本場名稱',`第 ${rounds.length+1} 場`);if(name===null)return;try{await api(`/series/${id}/rounds`,{method:'POST',body:{name,format:'single'}});await load();}catch(e){CX.toast(e.message)}};
 document.getElementById('copy').onclick=async()=>{const u=location.origin+'/series-public/'+state.shareSlug;CX.toast(await CX.copy(u)?'已複製觀眾網址':'複製失敗');};
}
function renderOverall(el,rows,rounds){let head=rounds.map(r=>`<th>第${r.round_no}</th>`).join('');el.innerHTML=`<div class="panel"><div class="section-title">累積積分</div><div class="table-scroll"><table class="score-table"><thead><tr><th>#</th><th>選手</th>${head}<th>總分</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="rank">${medal(x.overallRank)}</td><td class="player">${CX.esc(x.name)}</td>${rounds.map(r=>{const q=x.rounds.find(y=>y.roundId===r.id);return `<td>${q?q.points:0}</td>`}).join('')}<td class="total">${x.total}</td></tr>`).join('')}</tbody></table></div></div>`}
function renderRound(el,r){if(!r){el.innerHTML='<div class="empty-state">尚未建立賽程</div>';return} const wrap=document.createElement('div');el.innerHTML=`<div class="panel"><div class="round-head"><div><div class="eyebrow">ROUND ${r.round_no}</div><h3>${CX.esc(r.name)}</h3></div><span class="badge ${r.status==='done'?'done':'ongoing'}">${r.status==='done'?'已完成':'進行中'}</span></div><div id="bracket"></div></div>`;CXBracket.renderBracket(document.getElementById('bracket'),r.data,{editable:r.status!=='done',onRecord:async mid=>{const m=r.data.matches.find(x=>x.id===mid);if(!m)return;CXBracket.openScoreModal(m,async(a,b)=>{try{await api(`/series/${id}/rounds/${r.id}/matches/${mid}/result`,{method:'POST',body:{scoreA:a,scoreB:b}});await load();}catch(e){CX.toast(e.message)}})}})}
async function renderPoints(el,r){if(!r||r.status!=='done'){el.innerHTML='<div class="empty-state">本場完成後會自動產生積分</div>';return} const q=await api(`/series/${id}/rounds/${r.id}/points`);el.innerHTML=`<div class="panel"><div class="section-title">${CX.esc(r.name)} · 積分</div><div class="hint">系統依排名自動帶入，你可以在鎖定前手動修改。</div><div class="points-list">${q.points.map(x=>`<div class="point-row"><span class="rank">${medal(x.rank)}</span><span class="player">${CX.esc(x.name)}</span><input data-pid="${x.participant_id}" type="number" min="0" value="${x.points}" ${q.locked?'disabled':''}><span class="source">${x.source==='manual'?'手動':'自動'}</span></div>`).join('')}</div>${q.locked?'<div class="locked">🔒 本場積分已鎖定</div>':'<button class="btn btn-primary" id="confirm-points">確認並鎖定本場積分</button>'}</div>`;el.querySelectorAll('input[data-pid]').forEach(inp=>inp.onchange=async()=>{try{await api(`/series/${id}/rounds/${r.id}/points/${inp.dataset.pid}`,{method:'PATCH',body:{points:Number(inp.value)}});CX.toast('積分已更新')}catch(e){CX.toast(e.message)}});const b=document.getElementById('confirm-points');if(b)b.onclick=async()=>{try{await api(`/series/${id}/rounds/${r.id}/points/confirm`,{method:'POST'});await load();}catch(e){CX.toast(e.message)}}}
async function load(){try{state=await api(`/series/${id}`);render();}catch(e){app.innerHTML=`<div class="error-box">${CX.esc(e.message)}</div>`}};
document.getElementById('share').onclick=async()=>{try{const r=await api(`/series/${id}/share`,{method:'POST'});await CX.copy(location.origin+r.url);CX.toast('觀眾網址已複製');}catch(e){CX.toast(e.message)}};
load();
</script></body></html>
