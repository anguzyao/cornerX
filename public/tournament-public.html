<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>賽程即時進度 — Corner X</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="x-mark"></div>
      <div>
        <h1 id="t-title" style="font-size:19px;">賽程即時進度</h1>
        <div class="sub">Corner X · 公開觀看頁</div>
      </div>
    </div>
    <div class="readonly-banner">👁️ 這是唯讀頁面，僅供觀看即時賽程進度</div>
    <div id="content"><div class="loading">載入中…</div></div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/bracket-view.js"></script>
  <script>
    const slug = location.pathname.split('/').filter(Boolean).pop();
    const content = document.getElementById('content');

    async function load() {
      try {
        const t = await CX.api(`/public/tournaments/${encodeURIComponent(slug)}`);
        document.getElementById('t-title').textContent = t.name;
        document.title = t.name + ' — Corner X';
        const bracketDiv = document.createElement('div');
        content.innerHTML = '';
        content.appendChild(bracketDiv);
        CXBracket.renderBracket(bracketDiv, t.data, { editable: false });
      } catch (e) {
        content.innerHTML = `<div class="error-box">${CX.esc(e.message)}</div>`;
      }
    }
    load();
    setInterval(load, 15000); // 自動每 15 秒更新一次進度
  </script>
</body>
</html>
