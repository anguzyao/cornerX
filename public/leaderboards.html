<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的排行榜 — Corner X</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="shell">
    <div class="back-row">
      <a class="back-btn" href="/">←</a>
      <div class="page-title" style="margin:0;">我的排行榜</div>
    </div>
    <div id="list"><div class="loading">載入中…</div></div>
  </div>

  <div class="sticky-actions">
    <div class="inner">
      <button class="btn btn-primary" id="btn-new">＋ 建立新的排行榜</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    async function loadList() {
      const list = document.getElementById('list');
      try {
        const { leaderboards } = await CX.api('/leaderboards');
        if (!leaderboards.length) {
          list.innerHTML = `<div class="empty-state"><div class="big">🏆</div>還沒有任何排行榜<br>建立一張活動積分表吧</div>`;
          return;
        }
        list.innerHTML = leaderboards
          .map(
            (l) => `<a class="list-item" href="/leaderboard.html?id=${encodeURIComponent(l.id)}">
              <div class="body">
                <div class="name">${CX.esc(l.name)}</div>
                <div class="meta">更新於 ${CX.fmtTime(l.updated_at)}</div>
              </div>
              <div class="chev" style="color:var(--text-muted)">›</div>
            </a>`
          )
          .join('');
      } catch (e) {
        list.innerHTML = `<div class="error-box">${CX.esc(e.message)}</div>`;
      }
    }

    document.getElementById('btn-new').addEventListener('click', () => {
      const mask = document.createElement('div');
      mask.className = 'modal-mask';
      mask.innerHTML = `<div class="modal-sheet" style="position:relative;">
        <span class="modal-close">✕</span>
        <h3>建立新的排行榜</h3>
        <div class="field">
          <label>排行榜名稱</label>
          <input type="text" id="lb-name" placeholder="例如：今日活動積分">
        </div>
        <button class="btn btn-primary" id="lb-create">建立</button>
      </div>`;
      document.body.appendChild(mask);
      mask.addEventListener('click', (e) => { if (e.target === mask) mask.remove(); });
      mask.querySelector('.modal-close').addEventListener('click', () => mask.remove());
      mask.querySelector('#lb-create').addEventListener('click', async () => {
        const name = mask.querySelector('#lb-name').value.trim();
        if (!name) return CX.toast('請輸入排行榜名稱');
        try {
          const lb = await CX.api('/leaderboards', { method: 'POST', body: { name } });
          location.href = `/leaderboard.html?id=${encodeURIComponent(lb.id)}`;
        } catch (e) {
          CX.toast(e.message);
        }
      });
    });

    loadList();
  </script>
</body>
</html>
