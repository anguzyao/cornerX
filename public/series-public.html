<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Corner X · 即時賽事</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="shell public-shell"><div class="brand"><div class="x-mark"></div><div><h1>Corner X</h1><div class="sub">LIVE TOURNAMENT BOARD</div></div></div><div id="app"><div class="loading">載入中…</div></div></div>
<script src="/js/app.js"></script><script src="/js/bracket-view.js"></script><script>
const slug=location.pathname.split('/').filter(Boolean).pop(), app=document.getElementById('app'); let state=null;
function medal(rank){return ['🥇','🥈','🥉','4️⃣'][rank-1]||rank;}
function render(){const rounds=state.rounds||[],active=rounds.find(r=>r.status!=='done')||rounds[rounds.length-1], rows=state.overall||[]; app.innerHTML=`<div class="live-head"><div><div class="eyebrow accent">${state.status==='done'?'EVENT COMPLETE':'LIVE NOW'}</div><h2>${CX.esc(state.name)}</h2><div class="muted">${CX.esc(state.eventDate||'')}${state.location?' · '+CX.esc(state.location):''}</div></div><div class="status-dot ${state.status==='done'?'done':''}">${state.status==='done'?'已結束':'LIVE'}</div></div><div class="tabbar"><button class="tab active" data-tab="overall">積分排行榜</button><button class="tab" data-tab="live">即時賽程</button>${rounds.length?'<button class="tab" data-tab="rounds">各場結果</button>':''}</div><div id="tab-content"></div><div class="readonly-banner">◉ 唯讀觀眾模式 · 資料即時更新</div>`;
 const c=document.getElementById('tab-content'); function show(t){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));if(t==='overall')overall(c,rows,rounds);else if(t==='live')live(c,active);else results(c,rounds)} document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>show(x.dataset.tab));show('overall');}
function overall(el,rows,rounds){el.innerHTML=`<div class="panel"><div class="section-title">OVERALL RANKING</div><div class="table-scroll"><table class="score-table"><thead><tr><th>#</th><th>選手</th>${rounds.map(r=>`<th>第${r.round_no}</th>`).join('')}<th>總分</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="rank">${medal(x.overallRank)}</td><td class="player">${CX.esc(x.name)}</td>${rounds.map(r=>{const q=x.rounds.find(y=>y.roundId===r.id);return `<td>${q?q.points:0}</td>`}).join('')}<td class="total">${x.total}</td></tr>`).join('')}</tbody></table></div></div>`}
function live(el,r){if(!r){el.innerHTML='<div class="empty-state">尚未開始比賽</div>';return}el.innerHTML=`<div class="panel"><div class="round-head"><div><div class="eyebrow">ROUND ${r.round_no}</div><h3>${CX.esc(r.name)}</h3></div><span class="badge ${r.status==='done'?'done':'ongoing'}">${r.status==='done'?'已完成':'進行中'}</span></div><div id="bracket"></div></div>`;CXBracket.renderBracket(document.getElementById('bracket'),r.data,{editable:false});}
function results(el,rounds){el.innerHTML=rounds.slice().reverse().map(r=>`<div class="panel"><div class="round-head"><div><div class="eyebrow">ROUND ${r.round_no}</div><h3>${CX.esc(r.name)}</h3></div><span class="badge ${r.status==='done'?'done':'ongoing'}">${r.status==='done'?'已完成':'進行中'}</span></div>${r.points?.length?`<div class="points-list">${r.points.slice().sort((a,b)=>a.rank-b.rank).map(x=>`<div class="point-row"><span class="rank">${medal(x.rank)}</span><span class="player">${CX.esc(x.name||'')}</span><strong>+${x.points}</strong></div>`).join('')}</div>`:'<div class="hint">本場尚未結算積分</div>'}</div>`).join('')}
async function load(){try{state=await CX.api('/public/series/'+encodeURIComponent(slug));document.title=state.name+' — Corner X';render()}catch(e){app.innerHTML=`<div class="error-box">${CX.esc(e.message)}</div>`}} load();setInterval(load,5000);
</script></body></html>
