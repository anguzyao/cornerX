<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corner X — 陀螺賽程與排行榜</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="x-mark"></div>
      <div>
        <h1>Corner X</h1>
        <div class="sub">BEYBLADE X 賽程與排行榜工具</div>
      </div>
    </div>

    <div id="recent-slot"></div>

    <div class="action-grid">
      <a class="action-card" href="/create.html">
        <div class="icon">🆕</div>
        <div class="body">
          <div class="title">建立新的賽程</div>
          <div class="desc">輸入參賽者、選賽制，馬上開打</div>
        </div>
        <div class="chev">›</div>
      </a>
      <a class="action-card alt" href="/tournaments.html">
        <div class="icon">📋</div>
        <div class="body">
          <div class="title">載入賽程</div>
          <div class="desc">從歷史賽程中選一場繼續管理</div>
        </div>
        <div class="chev">›</div>
      </a>
      <a class="action-card" href="/leaderboards.html">
        <div class="icon">🏆</div>
        <div class="body">
          <div class="title">我的排行榜</div>
          <div class="desc">獨立記錄活動當天的積分排名</div>
        </div>
        <div class="chev">›</div>
      </a>
    </div>

    <footer class="foot">Corner X · 不需註冊，資料只存在你的裝置對應的私人空間</footer>
  </div>

  <script src="/js/app.js"></script>
  <script>
    (async function () {
      const slot = document.getElementById('recent-slot');
      try {
        const { tournament } = await CX.api('/tournaments/recent');
        if (tournament) {
          const a = document.createElement('a');
          a.className = 'action-card alt';
          a.style.marginBottom = '14px';
          a.href = `/tournament.html?id=${encodeURIComponent(tournament.id)}`;
          a.innerHTML = `
            <div class="icon">▶️</div>
            <div class="body">
              <div class="title">繼續上次賽程</div>
              <div class="desc">${CX.esc(tournament.name)} · ${tournament.status === 'done' ? '已結束' : '進行中'}</div>
            </div>
            <div class="chev">›</div>`;
          slot.appendChild(a);
        }
      } catch (e) {
        /* 忽略，首次使用者不會有歷史賽程 */
      }
    })();
  </script>
</body>
</html>
