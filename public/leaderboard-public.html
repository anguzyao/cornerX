<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>今日積分排行榜 — Corner X</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="shell">
    <div class="brand">
      <div class="x-mark"></div>
      <div>
        <h1 id="lb-title" style="font-size:19px;">積分排行榜</h1>
        <div class="sub">Corner X · 公開觀看頁</div>
      </div>
    </div>
    <div class="readonly-banner">👁️ 這是唯讀頁面，僅供觀看即時排名</div>
    <div id="content"><div class="loading">載入中…</div></div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/leaderboard-view.js"></script>
  <script>
    const slug = location.pathname.split('/').filter(Boolean).pop();
    const content = document.getElementById('content');

    async function load() {
      try {
        const lb = await CX.api(`/public/leaderboards/${encodeURIComponent(slug)}`);
        document.getElementById('lb-title').textContent = lb.name;
        document.title = lb.name + ' — Corner X';
        CXLeaderboard.renderLeaderboardView(content, lb.entries);
      } catch (e) {
        content.innerHTML = `<div class="error-box">${CX.esc(e.message)}</div>`;
      }
    }
    load();
    setInterval(load, 10000); // 自動每 10 秒更新一次排名
  </script>
</body>
</html>
