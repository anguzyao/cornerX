<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排行榜管理 — Corner X</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="shell">
    <div class="back-row">
      <a class="back-btn" href="/leaderboards.html">←</a>
      <div class="page-title" style="margin:0;" id="lb-title">排行榜管理</div>
    </div>

    <div class="field" style="display:flex; gap:8px; align-items:flex-end;">
      <div style="flex:1;">
        <label>新增參賽者</label>
        <input type="text" id="new-name" placeholder="輸入姓名，按 Enter 新增">
      </div>
      <button class="btn btn-primary btn-sm" id="btn-add" style="height:46px;">新增</button>
    </div>

    <div id="list"><div class="loading">載入中…</div></div>
  </div>

  <div class="sticky-actions">
    <div class="inner">
      <button class="btn btn-secondary" id="btn-share">🔗 分享排行榜</button>
      <button class="btn btn-danger" id="btn-delete" style="max-width:110px;">刪除</button>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/leaderboard-view.js"></script>
  <script>
    const id = CX.qs('id');
    const list = document.getElementById('list');

    function apply(lb) {
      document.getElementById('lb-title').textContent = lb.name;
      CXLeaderboard.renderLeaderboardEdit(list, lb.entries, {
        onAdjust: async (entryId, delta) => {
          const updated = await CX.api(`/leaderboards/${id}/entries/${entryId}/adjust`, { method: 'POST', body: { delta } });
          apply(updated);
        },
        onSetScore: async (entryId, score) => {
          const updated = await CX.api(`/leaderboards/${id}/entries/${entryId}`, { method: 'PATCH', body: { score } });
          apply(updated);
        },
        onRename: async (entryId, name) => {
          try {
            const updated = await CX.api(`/leaderboards/${id}/entries/${entryId}`, { method: 'PATCH', body: { name } });
            apply(updated);
          } catch (e) {
            CX.toast(e.message);
          }
        },
        onRemove: async (entryId) => {
          if (!confirm('確定要移除這位參賽者嗎？')) return;
          const updated = await CX.api(`/leaderboards/${id}/entries/${entryId}`, { method: 'DELETE' });
          apply(updated);
        },
      });
    }

    async function load() {
      try {
        const lb = await CX.api(`/leaderboards/${id}`);
        apply(lb);
      } catch (e) {
        list.innerHTML = `<div class="error-box">${CX.esc(e.message)}</div>`;
      }
    }

    async function addPlayer() {
      const input = document.getElementById('new-name');
      const name = input.value.trim();
      if (!name) return CX.toast('請輸入姓名');
      try {
        const updated = await CX.api(`/leaderboards/${id}/entries`, { method: 'POST', body: { name, score: 0 } });
        input.value = '';
        apply(updated);
      } catch (e) {
        CX.toast(e.message);
      }
    }
    document.getElementById('btn-add').addEventListener('click', addPlayer);
    document.getElementById('new-name').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addPlayer();
    });

    document.getElementById('btn-share').addEventListener('click', async () => {
      try {
        const { url } = await CX.api(`/leaderboards/${id}/share`, { method: 'POST' });
        const full = location.origin + url;
        const mask = document.createElement('div');
        mask.className = 'modal-mask';
        mask.innerHTML = `<div class="modal-sheet" style="position:relative;">
          <span class="modal-close">✕</span>
          <h3>分享排行榜</h3>
          <div class="share-box">
            <div class="hint" style="margin-bottom:8px;">任何拿到這個連結的人都可以「觀看」排行榜，但無法修改。</div>
            <div class="share-url">${CX.esc(full)}</div>
          </div>
          <button class="btn btn-primary" id="btn-copy">複製連結</button>
        </div>`;
        document.body.appendChild(mask);
        mask.addEventListener('click', (e) => { if (e.target === mask) mask.remove(); });
        mask.querySelector('.modal-close').addEventListener('click', () => mask.remove());
        mask.querySelector('#btn-copy').addEventListener('click', async () => {
          const ok = await CX.copy(full);
          CX.toast(ok ? '已複製連結' : '複製失敗，請手動選取');
        });
      } catch (e) {
        CX.toast(e.message);
      }
    });

    document.getElementById('btn-delete').addEventListener('click', async () => {
      if (!confirm('確定要刪除這個排行榜嗎？此動作無法復原。')) return;
      try {
        await CX.api(`/leaderboards/${id}`, { method: 'DELETE' });
        location.href = '/leaderboards.html';
      } catch (e) {
        CX.toast(e.message);
      }
    });

    load();
  </script>
</body>
</html>
